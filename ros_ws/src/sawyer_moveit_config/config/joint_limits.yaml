# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# 提升速度/加速度缩放因子（默认0.1太保守，改为0.8接近硬件上限，兼顾安全与效率）
default_velocity_scaling_factor: 0.8
default_acceleration_scaling_factor: 0.8

# 保留你的关节最大速度，补充官方推荐的加速度限制（基于Sawyer硬件参数）
joint_limits:
  right_j0:
    has_velocity_limits: true
    max_velocity: 1.74
    has_acceleration_limits: true
    max_acceleration: 0.87  # 官方推荐加速度（弧度/秒²）
  right_j1:
    has_velocity_limits: true
    max_velocity: 1.328
    has_acceleration_limits: true
    max_acceleration: 0.87
  right_j2:
    has_velocity_limits: true
    max_velocity: 1.957
    has_acceleration_limits: true
    max_acceleration: 0.87
  right_j3:
    has_velocity_limits: true
    max_velocity: 1.957
    has_acceleration_limits: true
    max_acceleration: 0.87
  right_j4:
    has_velocity_limits: true
    max_velocity: 3.485
    has_acceleration_limits: true
    max_acceleration: 1.05  # J4-J6为腕关节，加速度可略高
  right_j5:
    has_velocity_limits: true
    max_velocity: 3.485
    has_acceleration_limits: true
    max_acceleration: 1.05
  right_j6:
    has_velocity_limits: true
    max_velocity: 4.545
    has_acceleration_limits: true
    max_acceleration: 1.2  # 末端关节最大加速度
