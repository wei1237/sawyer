controller_list:
  # 机械臂关节轨迹控制器 -
  - name: /robot/limb/right
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - right_j0
      - right_j1
      - right_j2
      - right_j3
      - right_j4
      - right_j5
      - right_j6

  # 电动夹爪控制器 - 仿真环境固定用gripper_action，不是真实机器人的gripper_command
  - name: /robot/electric_gripper
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - right_gripper_l_finger_joint
      - right_gripper_r_finger_joint
