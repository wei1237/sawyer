# Real Sawyer MT3 grasp parameters.
# These values are starting placeholders. Tune them on the real table before
# enabling autonomous grasp execution.

sawyer_auto_grasp:
  # Execution mode marker used by launch/scripts for logging and sanity checks.
  execution_environment: real

  # Workspace bounds in Sawyer base frame: [min_x, min_y, min_z, max_x, max_y, max_z].
  # TODO: measure the reachable and collision-free real workspace.
  workspace: [0.10, -0.45, -0.20, 1.00, 0.45, 0.60]

  # Safe joint seed before grasp planning.
  # TODO: verify this pose is collision-free for your real table and camera setup.
  safe_joints:
    right_j0: 0.0
    right_j1: -0.8
    right_j2: 0.0
    right_j3: 1.8
    right_j4: 0.0
    right_j5: 0.0
    right_j6: 0.0

  # Real table/object height placeholders in base frame.
  # TODO: replace with measured table top and object center/top estimates.
  table_surface_z: 0.00
  object_base_z: 0.00
  top_grasp_clearance: 0.030
  pregrasp_clearance: 0.040
  final_descent_step: 0.003

  # TCP/flange offsets. Existing code commands right_hand by default.
  # TODO: measure from right_hand flange to actual fingertip/contact point.
  flange_grasp_z_offset: 0.040
  side_flange_grasp_z_offset: 0.000
  tcp_x_offset: 0.000
  tcp_y_offset: 0.000
  side_tcp_forward_offset: 0.000

  # Gripper behavior.
  # TODO: tune for the installed electric gripper fingers and object widths.
  gripper_name: right_gripper
  gripper_opening: 0.070
  gripper_cmd_velocity: 0.030
  left_finger_tip_frame: right_gripper_l_finger_tip
  right_finger_tip_frame: right_gripper_r_finger_tip

  # Motion speed limits for first real tests.
  normal_velocity_scale: 0.10
  normal_acceleration_scale: 0.10
  descent_velocity_scale: 0.05
  descent_acceleration_scale: 0.05

  # Camera topics. Replace these with the topics published by the real camera.
  # The internal Sawyer head camera is RGB only on many setups; RGB-D usually
  # comes from an external camera such as Kinect/RealSense.
  rgb_topic: /io/internal_camera/head_camera/image_raw
  depth_topic: /camera/depth/image_raw
  camera_info_topic: /camera/color/camera_info
  pointcloud_topic: /camera/depth_registered/points

  # TF frames. Prefer TF from the calibrated camera over hardcoded extrinsics.
  target_frame: base
  camera_frame: camera_color_optical_frame
  use_tf_camera_extrinsics: true
  allow_hardcoded_camera_fallback: false

